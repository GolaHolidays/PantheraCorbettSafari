name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build Next.js & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./web
        run: npm ci

      - name: 🏗️ Build static export
        working-directory: ./web
        run: npm run build

      - name: 🔍 Verify static export output
        run: |
          echo "Inspecting web/out build output:"
          ls -la web/out
          if [ ! -f "web/out/index.html" ]; then
            echo "❌ Verification failed: web/out/index.html not found!"
            exit 1
          fi
          echo "✅ Static build verified successfully."

      - name: 🚀 Deploy to Hostinger via rsync over SSH
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST || '62.72.28.18' }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || '65002' }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USERNAME || 'u291002470' }}
          HOSTINGER_TARGET_DIR: ${{ secrets.HOSTINGER_TARGET_DIR || 'public_html/pantheracorbettsafari/' }}
          HOSTINGER_SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD || secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          set -e

          TARGET_DIR="${HOSTINGER_TARGET_DIR%/}/"
          SSH_PORT="${HOSTINGER_PORT}"
          REMOTE_HOST="${HOSTINGER_HOST}"
          REMOTE_USER="${HOSTINGER_USER}"

          echo "=========================================="
          echo "Target Host:      ${REMOTE_HOST}"
          echo "Target Port:      ${SSH_PORT}"
          echo "Target User:      ${REMOTE_USER}"
          echo "Target Directory: ${TARGET_DIR}"
          echo "=========================================="

          SSH_OPTS="-p ${SSH_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          if [ -n "${HOSTINGER_SSH_KEY}" ]; then
            echo "🔐 Deploying with SSH Private Key..."
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            echo "${HOSTINGER_SSH_KEY}" | tr -d '\r' > ~/.ssh/id_hostinger
            chmod 600 ~/.ssh/id_hostinger

            rsync -avz --delete \
              --exclude '.well-known' \
              --exclude 'error_log' \
              --exclude '.trash' \
              -e "ssh -i ~/.ssh/id_hostinger ${SSH_OPTS}" \
              web/out/ \
              "${REMOTE_USER}@${REMOTE_HOST}:${TARGET_DIR}"

            echo "✅ Successfully deployed to Hostinger via SSH Key!"

          elif [ -n "${HOSTINGER_SSH_PASSWORD}" ]; then
            echo "🔑 Deploying with SSH Password (sshpass)..."
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

            sshpass -p "${HOSTINGER_SSH_PASSWORD}" rsync -avz --delete \
              --exclude '.well-known' \
              --exclude 'error_log' \
              --exclude '.trash' \
              -e "ssh ${SSH_OPTS}" \
              web/out/ \
              "${REMOTE_USER}@${REMOTE_HOST}:${TARGET_DIR}"

            echo "✅ Successfully deployed to Hostinger via SSH Password!"

          else
            echo "❌ [DEPLOYMENT ERROR]: No SSH credential found in GitHub Secrets!"
            echo ""
            echo "Please add one of the following secrets in your GitHub repository:"
            echo "  1) HOSTINGER_SSH_PASSWORD (or HOSTINGER_PASSWORD) with your Hostinger SSH password"
            echo "     OR"
            echo "  2) HOSTINGER_SSH_KEY with your SSH private key"
            echo ""
            echo "Navigation: GitHub Repository -> Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi
